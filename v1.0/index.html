<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>挂机文字 RPG</title>
  <link rel="stylesheet" href="css/style.css?v=release-20260614-20" />
  <link rel="stylesheet" href="css/combat-demo.css?v=release-20260614-3" />
  <link rel="stylesheet" href="css/home-demo.css?v=release-20260621-2" />
  <link rel="stylesheet" href="css/gm.css?v=release-20260614-20" />
</head>
<body>
  <div id="ui-root"></div>
  <div id="toast-container" class="toast-container"></div>
  <script>
    (function () {
      function showBootError(title, detail) {
        var root = document.getElementById('ui-root');
        if (!root) return;
        var box = document.createElement('div');
        box.style.cssText = 'margin:24px;padding:16px;border:2px solid #b34;background:#fff8f3;color:#4a1f12;font-family:var(--pixel-font);white-space:pre-wrap;';
        var heading = document.createElement('b');
        heading.textContent = title;
        box.appendChild(heading);
        box.appendChild(document.createTextNode('\n\n' + String(detail || 'Unknown error')));
        root.replaceChildren(box);
      }
      window.addEventListener('error', function (event) {
        showBootError('启动错误', event.message + '\n' + (event.filename || '') + ':' + (event.lineno || 0) + ':' + (event.colno || 0));
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason || {};
        showBootError('异步启动错误', (reason.stack || reason.message || reason));
      });
    }());
  </script>
  <script type="module" src="main.js?v=release-20260830-3"></script>
  <script src="gm.js?v=release-20260830-3"></script>
</body>
</html>
